<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeiroX Mini App</title>
    <!-- ОБЯЗАТЕЛЬНО: Подключаем скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #1e1e1e);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 { color: #00ff88; }
        button {
            background-color: #00aa44;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>🎮 NeiroX Mini App</h1>
    <p>Привет, <span id="user-name">друг</span>!</p>
    <p>Твой ID: <span id="user-id">...</span></p>
    
    <button id="main-button">Нажми меня</button>

    <script>
        // Получаем доступ к API Telegram
        const tg = window.Telegram.WebApp;
        
        // Говорим Telegram, что приложение готово
        tg.ready();

        // Получаем данные пользователя
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-name').innerText = user.first_name;
            document.getElementById('user-id').innerText = user.id;
        }

        // Обработка кнопки
        document.getElementById('main-button').addEventListener('click', () => {
            // Отправляем данные обратно в бота (если нужно)
            tg.sendData(JSON.stringify({ action: "button_clicked" }));
            
            // Или просто показываем алерт
            tg.showAlert("Ты нажал кнопку в Mini App!");
        });
    </script>
</body>
</html>
