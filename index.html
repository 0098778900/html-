<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeiroX App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0f0f1a);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #aaaaaa);
            --card-bg: rgba(30, 30, 46, 0.8);
            --accent: #f1c40f;
        }

        body {
            background: radial-gradient(circle at top, #1a1a2e 0%, #0f0f1a 100%);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; box-sizing: border-box;
        }

        /* Общие стили для страниц */
        .page {
            display: none; 
            width: 100%; max-width: 400px;
            flex-direction: column; align-items: center;
            animation: fadeIn 0.3s ease-in-out;
        }
        .page.active {
            display: flex; 
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- СТРАНИЦА ПРОФИЛЯ --- */
        .profile-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px 20px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        .avatar-container {
            position: relative;
            width: 120px; height: 120px;
            margin: 0 auto 15px auto;
            display: flex; justify-content: center; align-items: center;
        }

        .avatar-container::before {
            content: ''; position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #00ff88, #00aaff, #ff00ff, #00ff88);
            animation: rotate 4s linear infinite;
            z-index: 0; filter: blur(8px); opacity: 0.8;
        }
        .avatar-container::after {
            content: ''; position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            box-shadow: 0 0 30px #00ff88;
            animation: pulse 2s ease-in-out infinite;
            z-index: 0;
        }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        @keyframes pulse {
            0% { box-shadow: 0 0 20px rgba(0, 255, 136, 0.4); }
            50% { box-shadow: 0 0 50px rgba(0, 255, 136, 0.8); }
            100% { box-shadow: 0 0 20px rgba(0, 255, 136, 0.4); }
        }

        .avatar {
            width: 100px; height: 100px;
            border-radius: 50%; border: 4px solid #111;
            object-fit: cover; position: relative; z-index: 1;
        }

        .name { font-size: 24px; font-weight: bold; margin: 0 0 5px 0; }
        .username { font-size: 16px; color: var(--hint-color); margin: 0 0 20px 0; }

        .stats-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 10px; margin-top: 20px;
        }
        .stat-item {
            background: rgba(0, 0, 0, 0.3); padding: 15px;
            border-radius: 12px; display: flex; flex-direction: column; align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .stat-value { font-size: 22px; font-weight: bold; color: var(--accent); }
        .stat-label { font-size: 12px; color: var(--hint-color); text-transform: uppercase; margin-top: 5px; }

        .btn {
            background-color: #00aa44; color: white;
            border: none; padding: 15px; border-radius: 12px;
            font-size: 16px; font-weight: bold; width: 100%;
            margin-top: 20px; cursor: pointer; transition: transform 0.2s;
            text-transform: uppercase;
        }
        .btn:active { transform: scale(0.95); }
        .btn-back { background-color: #333; margin-top: 10px;}

        /* --- СТРАНИЦА КАЗИНО --- */
        .balance-box {
            background: rgba(0, 0, 0, 0.6); padding: 15px 30px;
            border-radius: 15px; border: 2px solid var(--accent);
            box-shadow: 0 0 20px rgba(241, 196, 15, 0.2);
            text-align: center; margin-bottom: 20px; width: 100%; box-sizing: border-box;
        }
        .balance-value { font-size: 36px; font-weight: bold; color: var(--accent); text-shadow: 0 0 10px rgba(241, 196, 15, 0.5); }

        .slots-container {
            display: flex; gap: 10px; background: #111;
            padding: 20px; border-radius: 20px;
            border: 4px solid #333; box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
            margin-bottom: 20px;
        }
        .reel {
            width: 80px; height: 100px; background: #222;
            border-radius: 10px; display: flex; justify-content: center; align-items: center;
            font-size: 50px; border: 2px solid #444; box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        .reel.spinning { animation: spin 0.2s linear infinite; }
        @keyframes spin {
            0% { transform: translateY(-10px); } 50% { transform: translateY(10px); } 100% { transform: translateY(-10px); }
        }

        .bet-input {
            width: 100%; padding: 15px; font-size: 20px;
            background: #000; border: 2px solid #555;
            color: var(--accent); border-radius: 10px;
            text-align: center; box-sizing: border-box; font-weight: bold; margin-bottom: 15px;
        }
        .result-text {
            text-align: center; font-size: 20px; font-weight: bold;
            height: 30px; margin-top: 20px; text-shadow: 0 0 10px currentColor;
        }

    </style>
</head>
<body>

    <!-- СТРАНИЦА 1: ПРОФИЛЬ -->
    <div id="page-profile" class="page active">
        <div class="profile-card">
            <div class="avatar-container">
                <img src="" alt="Avatar" class="avatar" id="user-avatar">
            </div>
            <h1 class="name" id="user-name">Загрузка...</h1>
            <p class="username" id="user-username">@...</p>
            
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-value" style="color: #00aaff;" id="user-id">...</span>
                    <span class="stat-label">ID</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="profile-balance" style="color: #00ff88;">⭐ ...</span>
                    <span class="stat-label">Баланс</span>
                </div>
            </div>

            <button class="btn" onclick="switchPage('page-casino')">Перейти в Казино 🎰</button>
            <button class="btn btn-back" onclick="tg.close()">Закрыть</button>
        </div>
    </div>

    <!-- СТРАНИЦА 2: КАЗИНО -->
    <div id="page-casino" class="page">
        <div class="balance-box">
            <div class="stat-label">Твой игровой баланс</div>
            <div class="balance-value" id="casino-balance">...</div>
        </div>

        <div class="slots-container">
            <div class="reel" id="reel1">🍒</div>
            <div class="reel" id="reel2">🍋</div>
            <div class="reel" id="reel3">💎</div>
        </div>

        <input type="number" id="betAmount" class="bet-input" value="100" min="100" step="50">
        <button class="btn" id="spinBtn" onclick="spin()">КРУТИТЬ 🎰</button>
        
        <div class="result-text" id="resultText"></div>
        
        <button class="btn btn-back" onclick="switchPage('page-profile')">⬅ Назад в профиль</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // --- НАВИГАЦИЯ ---
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        // --- ИНИЦИАЛИЗАЦИЯ ПРОФИЛЯ И БАЛАНСА ---
        const user = tg.initDataUnsafe?.user;
        let casinoBalance = 1000; // Дефолтное значение

        if (user) {
            // 1. Заполняем профиль
            document.getElementById('user-name').innerText = user.first_name;
            document.getElementById('user-username').innerText = '@' + (user.username || 'нет_юзернейма');
            document.getElementById('user-id').innerText = user.id;
            
            const avatarUrl = user.photo_url || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.first_name) + '&background=00aa44&color=fff&size=200';
            document.getElementById('user-avatar').src = avatarUrl;

            // 2. ЗАПРАШИВАЕМ БАЛАНС ИЗ БД (С ОБХОДОМ NGROK)
            const API_URL = "https://goofiness-equator-velvet.ngrok-free.dev/api/balance/" + user.id + "?v=" + Date.now();

            fetch(API_URL, {
                method: 'GET',
                headers: {
                    'ngrok-skip-browser-warning': 'true' // <-- ГЛАВНЫЙ ФИКС
                }
            })
                .then(response => {
                    if (!response.ok) throw new Error("Ошибка сервера");
                    return response.json();
                })
                .then(data => {
                    casinoBalance = data.balance;
                    document.getElementById('profile-balance').innerText = '⭐ ' + casinoBalance;
                    document.getElementById('casino-balance').innerText = casinoBalance;
                })
                .catch(error => {
                    console.error("Ошибка:", error);
                    document.getElementById('profile-balance').innerText = '⭐ 1000 (Оффлайн)';
                    document.getElementById('casino-balance').innerText = '1000';
                });
        }

        // --- ЛОГИКА КАЗИНО ---
        let isSpinning = false;
        const symbols = ['🍒', '🍋', '🍊', '💎', '7️⃣', '🔔'];
        const balanceDisplay = document.getElementById('casino-balance');
        const resultText = document.getElementById('resultText');
        const spinBtn = document.getElementById('spinBtn');
        const betInput = document.getElementById('betAmount');

        function spin() {
            if (isSpinning) return;

            const bet = parseInt(betInput.value);

            if (isNaN(bet) || bet < 100) {
                resultText.innerText = "Минимальная ставка 100!";
                resultText.style.color = "#e74c3c";
                return;
            }
            if (bet > casinoBalance) {
                resultText.innerText = "Недостаточно средств!";
                resultText.style.color = "#e74c3c";
                return;
            }

            // Списываем
            casinoBalance -= bet;
            balanceDisplay.innerText = casinoBalance;
            resultText.innerText = "";
            isSpinning = true;
            spinBtn.disabled = true;
            spinBtn.style.background = "#333";

            const reels = [
                document.getElementById('reel1'),
                document.getElementById('reel2'),
                document.getElementById('reel3')
            ];
            reels.forEach(r => r.classList.add('spinning'));

            const spinInterval = setInterval(() => {
                reels.forEach(r => {
                    r.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                });
            }, 50);

            setTimeout(() => {
                clearInterval(spinInterval);
                reels.forEach(r => r.classList.remove('spinning'));

                const res1 = symbols[Math.floor(Math.random() * symbols.length)];
                const res2 = symbols[Math.floor(Math.random() * symbols.length)];
                const res3 = symbols[Math.floor(Math.random() * symbols.length)];

                reels[0].innerText = res1;
                reels[1].innerText = res2;
                reels[2].innerText = res3;

                // Проверка выигрыша (3 в ряд)
                if (res1 === res2 && res2 === res3) {
                    const winAmount = bet * 3;
                    casinoBalance += winAmount;
                    balanceDisplay.innerText = casinoBalance;
                    resultText.innerText = `🎉 ДЖЕКПОТ! Выигрыш: +${winAmount}`;
                    resultText.style.color = "#f1c40f";
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                } else {
                    resultText.innerText = `😢 Проигрыш: -${bet}`;
                    resultText.style.color = "#e74c3c";
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                }

                isSpinning = false;
                spinBtn.disabled = false;
                spinBtn.style.background = "#00aa44";
                
                if (casinoBalance < 100) {
                    spinBtn.disabled = true;
                    spinBtn.style.background = "#333";
                    resultText.innerText = "У тебя закончились деньги!";
                }

            }, 2000);
        }
    </script>
</body>
</html>
