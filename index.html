<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeiroX App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0f0f1a);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #aaaaaa);
            --card-bg: rgba(30, 30, 46, 0.8);
            --accent: #f1c40f;
        }
        body {
            background: radial-gradient(circle at top, #1a1a2e 0%, #0f0f1a 100%);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; box-sizing: border-box;
            overflow: hidden;
        }
        .page { display: none; width: 100%; max-width: 400px; flex-direction: column; align-items: center; }
        .page.active { display: flex; }
        
        /* Профиль */
        .profile-card {
            background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 30px 20px; width: 100%; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(10px);
        }
        .avatar-container {
            position: relative; width: 120px; height: 120px; margin: 0 auto 15px auto;
            display: flex; justify-content: center; align-items: center;
        }
        .avatar-container::before {
            content: ''; position: absolute; top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 50%; background: conic-gradient(from 0deg, #00ff88, #00aaff, #ff00ff, #00ff88);
            animation: rotate 4s linear infinite; z-index: 0; filter: blur(8px); opacity: 0.8;
        }
        .avatar-container::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%; box-shadow: 0 0 30px #00ff88; animation: pulse 2s ease-in-out infinite; z-index: 0;
        }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0% { box-shadow: 0 0 20px rgba(0, 255, 136, 0.4); } 50% { box-shadow: 0 0 50px rgba(0, 255, 136, 0.8); } 100% { box-shadow: 0 0 20px rgba(0, 255, 136, 0.4); } }
        .avatar { width: 100px; height: 100px; border-radius: 50%; border: 4px solid #111; object-fit: cover; position: relative; z-index: 1; }
        .name { font-size: 24px; font-weight: bold; margin: 0 0 5px 0; }
        .username { font-size: 16px; color: var(--hint-color); margin: 0 0 20px 0; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .stat-item {
            background: rgba(0, 0, 0, 0.3); padding: 15px; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; border: 1px solid rgba(255,255,255,0.05);
        }
        .stat-value { font-size: 22px; font-weight: bold; color: var(--accent); }
        .stat-label { font-size: 12px; color: var(--hint-color); text-transform: uppercase; margin-top: 5px; }
        .btn {
            background-color: #00aa44; color: white; border: none; padding: 15px;
            border-radius: 12px; font-size: 16px; font-weight: bold; width: 100%;
            margin-top: 20px; cursor: pointer; transition: transform 0.2s; text-transform: uppercase;
        }
        .btn:active { transform: scale(0.95); }
        .btn-back { background-color: #333; margin-top: 10px; }

        /* Казино */
        .balance-box {
            background: rgba(0, 0, 0, 0.6); padding: 15px 30px; border-radius: 15px;
            border: 2px solid var(--accent); box-shadow: 0 0 20px rgba(241, 196, 15, 0.2);
            text-align: center; margin-bottom: 20px; width: 100%; box-sizing: border-box;
        }
        .balance-value { font-size: 36px; font-weight: bold; color: var(--accent); text-shadow: 0 0 10px rgba(241, 196, 15, 0.5); }
        .slots-container {
            display: flex; gap: 10px; background: #111; padding: 20px; border-radius: 20px;
            border: 4px solid #333; box-shadow: inset 0 0 30px rgba(0,0,0,0.8); margin-bottom: 20px;
        }
        .reel {
            width: 80px; height: 100px; background: #222; border-radius: 10px;
            display: flex; justify-content: center; align-items: center; font-size: 50px; border: 2px solid #444;
        }
        .reel.spinning { animation: spin 0.2s linear infinite; }
        @keyframes spin { 0% { transform: translateY(-10px); } 50% { transform: translateY(10px); } 100% { transform: translateY(-10px); } }
        .bet-input {
            width: 100%; padding: 15px; font-size: 20px; background: #000;
            border: 2px solid #555; color: var(--accent); border-radius: 10px;
            text-align: center; box-sizing: border-box; font-weight: bold; margin-bottom: 15px;
        }
        .result-text { text-align: center; font-size: 20px; font-weight: bold; height: 30px; margin-top: 20px; text-shadow: 0 0 10px currentColor; }

        /* Змейка */
        #snake-canvas {
            background: #000;
            border: 4px solid #333;
            border-radius: 10px;
            touch-action: none;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
        }
        .game-over-text { font-size: 20px; color: #ff4444; font-weight: bold; margin-top: 20px; display: none; text-align: center; }
    </style>
</head>
<body>

    <!-- ПРОФИЛЬ -->
    <div id="page-profile" class="page active">
        <div class="profile-card">
            <div class="avatar-container">
                <img src="" alt="Avatar" class="avatar" id="user-avatar">
            </div>
            <h1 class="name" id="user-name">Загрузка...</h1>
            <p class="username" id="user-username">@...</p>
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-value" style="color: #00aaff;" id="user-id">...</span>
                    <span class="stat-label">ID</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="profile-balance" style="color: #00ff88;">⭐ ...</span>
                    <span class="stat-label">Баланс</span>
                </div>
            </div>
            <button class="btn" onclick="switchPage('page-casino')">Перейти в Казино 🎰</button>
            <button class="btn" onclick="startSnake()">Играть в Змейку 🐍</button>
            <button class="btn btn-back" onclick="tg.close()">Закрыть</button>
        </div>
    </div>

    <!-- КАЗИНО -->
    <div id="page-casino" class="page">
        <div class="balance-box">
            <div class="stat-label">Твой игровой баланс</div>
            <div class="balance-value" id="casino-balance">...</div>
        </div>
        <div class="slots-container">
            <div class="reel" id="reel1">🍒</div>
            <div class="reel" id="reel2">🍋</div>
            <div class="reel" id="reel3">💎</div>
        </div>
        <input type="number" id="betAmount" class="bet-input" value="100" min="100" step="50">
        <button class="btn" id="spinBtn" onclick="spin()">КРУТИТЬ 🎰</button>
        <div class="result-text" id="resultText"></div>
        <button class="btn btn-back" onclick="switchPage('page-profile')">⬅ Назад в профиль</button>
    </div>

    <!-- ЗМЕЙКА -->
    <div id="page-snake" class="page">
        <h2 style="color: #00ff88; margin-bottom: 10px;">🐍 Змейка</h2>
        <div style="color: #aaa; margin-bottom: 10px;">Счет: <span id="snake-score" style="color: white; font-weight: bold;">0</span></div>
        <canvas id="snake-canvas" width="300" height="300"></canvas>
        <div id="snake-gameover" class="game-over-text">Игра окончена!<br><span id="snake-final-score" style="color: white;"></span></div>
        <button class="btn btn-back" onclick="switchPage('page-profile')">⬅ Назад в профиль</button>
    </div>

    <script>
        // Безопасная инициализация Telegram API
        const tg = window.Telegram?.WebApp;
        let user = null;

        if (tg) {
            tg.ready();
            tg.expand();
            user = tg.initDataUnsafe?.user;
        }

        // ВСТАВЬ СЮДА СВОЮ ССЫЛКУ ОТ NGROK
        const API_BASE_URL = "https://goofiness-equator-velvet.ngrok-free.dev";
        let casinoBalance = 1000; 

        // НАВИГАЦИЯ
        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            if (pageId === 'page-snake') {
                document.getElementById('snake-gameover').style.display = 'none';
                startSnakeGame();
            } else {
                stopSnakeGame();
            }
        }

        // ЗАГРУЗКА ПРОФИЛЯ
        if (user) {
            document.getElementById('user-name').innerText = user.first_name;
            document.getElementById('user-username').innerText = '@' + (user.username || 'нет_юзернейма');
            document.getElementById('user-id').innerText = user.id;
            document.getElementById('user-avatar').src = user.photo_url || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.first_name) + '&background=00aa44&color=fff&size=200';

            fetch(`${API_BASE_URL}/api/balance/${user.id}?v=${Date.now()}`, {
                headers: { 'ngrok-skip-browser-warning': 'true' }
            })
            .then(res => res.json())
            .then(data => {
                casinoBalance = data.balance;
                document.getElementById('profile-balance').innerText = '⭐ ' + casinoBalance.toLocaleString('ru-RU');
                document.getElementById('casino-balance').innerText = casinoBalance.toLocaleString('ru-RU');
            })
            .catch(err => {
                document.getElementById('profile-balance').innerText = '⭐ 1000 (Оффлайн)';
            });
        } else {
            document.getElementById('user-name').innerText = "Ошибка: Открой через Telegram";
        }

        // ОБНОВЛЕНИЕ БАЛАНСА
        function updateBalanceOnServer(userId, amount, callback) {
            if (!userId) return;
            fetch(`${API_BASE_URL}/api/update_balance`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
                body: JSON.stringify({ user_id: userId, amount: amount })
            })
            .then(res => res.json())
            .then(data => {
                if(callback) callback();
            })
            .catch(err => console.error("Ошибка:", err));
        }

        // --- КАЗИНО ---
        let isSpinning = false;
        const symbols = ['🍒', '🍋', '🍊', '💎', '7️⃣', '🔔'];
        
        function spin() {
            if (isSpinning || !user) return;
            const bet = parseInt(document.getElementById('betAmount').value);
            if (isNaN(bet) || bet < 100 || bet > casinoBalance) return;

            casinoBalance -= bet;
            document.getElementById('casino-balance').innerText = casinoBalance.toLocaleString('ru-RU');
            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;

            const reels = [document.getElementById('reel1'), document.getElementById('reel2'), document.getElementById('reel3')];
            reels.forEach(r => r.classList.add('spinning'));

            const spinInterval = setInterval(() => {
                reels.forEach(r => r.innerText = symbols[Math.floor(Math.random() * symbols.length)]);
            }, 50);

            setTimeout(() => {
                clearInterval(spinInterval);
                reels.forEach(r => r.classList.remove('spinning'));
                const res1 = symbols[Math.floor(Math.random() * symbols.length)];
                const res2 = symbols[Math.floor(Math.random() * symbols.length)];
                const res3 = symbols[Math.floor(Math.random() * symbols.length)];
                reels[0].innerText = res1; reels[1].innerText = res2; reels[2].innerText = res3;

                if (res1 === res2 && res2 === res3) {
                    const win = bet * 3;
                    casinoBalance += win;
                    document.getElementById('resultText').innerText = `🎉 ДЖЕКПОТ! +${win}`;
                    document.getElementById('resultText').style.color = "#f1c40f";
                    updateBalanceOnServer(user.id, win);
                } else {
                    document.getElementById('resultText').innerText = `😢 Проигрыш: -${bet}`;
                    document.getElementById('resultText').style.color = "#e74c3c";
                    updateBalanceOnServer(user.id, -bet);
                }
                document.getElementById('casino-balance').innerText = casinoBalance.toLocaleString('ru-RU');
                isSpinning = false;
                document.getElementById('spinBtn').disabled = false;
            }, 2000);
        }

        // --- ЗМЕЙКА ---
        let snakeInterval = null;
        let snakeScore = 0;

        function startSnake() {
            switchPage('page-snake');
        }

        function startSnakeGame() {
            const canvas = document.getElementById('snake-canvas');
            const ctx = canvas.getContext('2d');
            const gridSize = 15;
            const cellSize = canvas.width / gridSize;

            let snake = [{x: 5, y: 5}];
            let food = {x: 10, y: 10};
            let dx = 0;
            let dy = 0;
            let gameStarted = false; 

            snakeScore = 0;
            document.getElementById('snake-score').innerText = snakeScore;
            document.getElementById('snake-gameover').style.display = 'none';

            document.onkeydown = (e) => {
                if (e.key === 'ArrowUp' && dy !== 1) { dx = 0; dy = -1; gameStarted = true; }
                if (e.key === 'ArrowDown' && dy !== -1) { dx = 0; dy = 1; gameStarted = true; }
                if (e.key === 'ArrowLeft' && dx !== 1) { dx = -1; dy = 0; gameStarted = true; }
                if (e.key === 'ArrowRight' && dx !== -1) { dx = 1; dy = 0; gameStarted = true; }
            };

            let touchStartX = 0, touchStartY = 0;
            canvas.addEventListener('touchstart', e => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            });
            canvas.addEventListener('touchend', e => {
                let touchEndX = e.changedTouches[0].clientX;
                let touchEndY = e.changedTouches[0].clientY;
                let diffX = touchEndX - touchStartX;
                let diffY = touchEndY - touchStartY;

                if (Math.abs(diffX) > Math.abs(diffY)) {
                    if (diffX > 0 && dx !== -1) { dx = 1; dy = 0; gameStarted = true; }
                    else if (diffX < 0 && dx !== 1) { dx = -1; dy = 0; gameStarted = true; }
                } else {
                    if (diffY > 0 && dy !== -1) { dx = 0; dy = 1; gameStarted = true; }
                    else if (diffY < 0 && dy !== 1) { dx = 0; dy = -1; gameStarted = true; }
                }
            });

            if (snakeInterval) clearInterval(snakeInterval);
            
            snakeInterval = setInterval(() => {
                if (!gameStarted) return; 

                const head = {x: snake[0].x + dx, y: snake[0].y + dy};

                if (head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize) {
                    gameOverSnake();
                    return;
                }

                for (let i = 0; i < snake.length; i++) {
                    if (snake[i].x === head.x && snake[i].y === head.y) {
                        gameOverSnake();
                        return;
                    }
                }

                snake.unshift(head);

                if (head.x === food.x && head.y === food.y) {
                    snakeScore += 10;
                    document.getElementById('snake-score').innerText = snakeScore;
                    food = {
                        x: Math.floor(Math.random() * gridSize),
                        y: Math.floor(Math.random() * gridSize)
                    };
                } else {
                    snake.pop();
                }

                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ff4444';
                ctx.beginPath();
                ctx.arc(food.x * cellSize + cellSize/2, food.y * cellSize + cellSize/2, cellSize/2 - 1, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#00ff88';
                snake.forEach((part) => {
                    ctx.fillRect(part.x * cellSize + 1, part.y * cellSize + 1, cellSize - 2, cellSize - 2);
                });
            }, 150); 
        }

        function gameOverSnake() {
            clearInterval(snakeInterval);
            document.getElementById('snake-gameover').style.display = 'block';
            
            let botReward = Math.floor(snakeScore / 10) * 5;
            
            document.getElementById('snake-final-score').innerText = 
                `Твой счет: ${snakeScore}\nНачислено очков: +${botReward} ⭐`;

            if (botReward > 0 && user) {
                updateBalanceOnServer(user.id, botReward, () => {
                    fetch(`${API_BASE_URL}/api/balance/${user.id}?v=${Date.now()}`, {
                        headers: { 'ngrok-skip-browser-warning': 'true' }
                    })
                    .then(res => res.json())
                    .then(data => {
                        casinoBalance = data.balance;
                        document.getElementById('profile-balance').innerText = '⭐ ' + casinoBalance.toLocaleString('ru-RU');
                        document.getElementById('casino-balance').innerText = casinoBalance.toLocaleString('ru-RU');
                    });
                });
            }
        }

        function stopSnakeGame() {
            if (snakeInterval) clearInterval(snakeInterval);
        }
    </script>
</body>
</html>
